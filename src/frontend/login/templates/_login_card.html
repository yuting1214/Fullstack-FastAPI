<section class="auth-card" id="login-card">
    <div class="auth-brand" aria-hidden="true">
        <svg class="auth-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="10" width="16" height="10" rx="2.5"></rect>
            <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
            <circle cx="12" cy="15" r="1.4" fill="currentColor" stroke="none"></circle>
        </svg>
    </div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-subtitle">Sign in to view the API documentation</p>

    {% if message %}
    <div class="auth-alert" role="alert">{{ message }}</div>
    {% endif %}

    <form action="/login" method="post" class="auth-form"
          hx-post="/login" hx-target="#login-card" hx-swap="outerHTML">
        <label class="auth-field">
            <span class="auth-label">Username</span>
            <input type="text" name="username" autocomplete="username"
                   placeholder="admin" required autofocus>
        </label>
        <label class="auth-field">
            <span class="auth-label">Password</span>
            <input type="password" name="password" autocomplete="current-password"
                   placeholder="••••••••••••" required>
        </label>
        <button type="submit" class="auth-submit">
            <span class="auth-submit-label">Sign in</span>
            <span class="auth-spinner" aria-hidden="true"></span>
        </button>
    </form>
</section>
